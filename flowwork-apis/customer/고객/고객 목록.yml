info:
  name: 고객 목록
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/customers"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: 인증 토큰 (Bearer)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "output: id=고객 ID, name=고객명, phone=전화번호"
