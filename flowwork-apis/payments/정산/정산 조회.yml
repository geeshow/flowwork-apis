info:
  name: 정산 조회
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/customers/{{customerId}}/settlement"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: 인증 토큰 (Bearer)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "output: settlementId=정산 ID, status=상태, amount=금액"
