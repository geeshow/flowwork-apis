info:
  name: 사용자 상태 코드
  type: http
  seq: 2

http:
  method: GET
  url: "{{coreBaseUrl}}/meta/codes/user_status"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: 인증 토큰 (Bearer)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "output: code=코드, name=코드명"
