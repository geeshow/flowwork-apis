info:
  name: 메타 코드 조회
  type: http
  seq: 3

http:
  method: GET
  url: "{{coreBaseUrl}}/meta/codes/{{code_group}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: 인증 토큰 (Bearer)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "output: code=코드, name=코드명"
