info:
  name: 계좌 활성 상태 코드
  type: http
  seq: 1

http:
  method: GET
  url: "{{coreBaseUrl}}/meta/codes/account_status"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: 인증 토큰 (Bearer)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "output: code=코드, name=코드명"
