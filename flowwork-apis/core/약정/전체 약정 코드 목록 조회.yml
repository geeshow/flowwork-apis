info:
  name: 전체 약정 코드 목록 조회
  type: http
  seq: 1

http:
  method: GET
  url: "{{coreBaseUrl}}/agreements/codes"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: 인증 토큰 (Bearer)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "output: code=코드, name=코드명"
