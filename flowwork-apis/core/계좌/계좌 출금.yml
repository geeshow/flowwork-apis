info:
  name: 계좌 출금
  type: http
  seq: 4

http:
  method: POST
  url: "{{coreBaseUrl}}/accounts/{{accountNo}}/withdraw"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: 인증 토큰 (Bearer)
    - name: Content-Type
      value: application/json
      description: 요청 본문 형식
  body:
    type: json
    data: '{"amount": {{amount}}, "password": "{{password}}"}'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "output: accountNo=계좌번호, status=상태, withdrawnAmount=출금액, balanceAfter=출금 후 잔액, reason=사유"
