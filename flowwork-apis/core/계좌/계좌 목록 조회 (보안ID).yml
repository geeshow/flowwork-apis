info:
  name: 계좌 목록 조회 (보안ID)
  type: http
  seq: 2

http:
  method: GET
  url: "{{coreBaseUrl}}/accounts?sec_user_id={{sec_user_id}}"
  headers:
    - name: Authorization
      value: Bearer {{authToken}}
      description: 인증 토큰 (Bearer)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: "output: accountNo=계좌번호, name=계좌명, accountType=계좌 유형, status=상태, openedAt=개설일, closedAt=폐쇄일, owner.name=소유자명, owner.cif=소유자 CIF, balance.amount=잔액, balance.currency=통화, tags=태그"
